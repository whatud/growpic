<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>블로그 | 그로우픽</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo/favicon.svg?v=20260921c" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png?v=20260921c" sizes="32x32" type="image/png">
<link rel="icon" href="assets/logo/favicon.ico?v=20260921c" sizes="any">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png?v=20260921c">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="blog-data.js"></script>
</head>
<body>
<header id="gh"></header>
<main><article class="article" id="art"></article></main>
<footer id="gf"></footer>
<script src="layout.js"></script>
<script>
(function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var id = new URLSearchParams(location.search).get('id');
  var pv = /[?&]preview=1/.test(location.search);
  var p = window.GP_postsForView().filter(function (x) { return x.id === id; })[0];
  var el = document.getElementById('art');
  var back = '<a class="a-back" href="blog.html' + (pv ? '?preview=1' : '') + '">← 블로그 목록</a>';
  if (!p) { el.innerHTML = '<div class="empty"><b>글을 찾을 수 없습니다</b>주소가 바뀌었거나 내려간 글입니다.</div>' + back; return; }
  document.title = p.title + ' | 그로우픽';
  var body = p.body.map(function (b) {
    if (typeof b === 'string') return '<p>' + esc(b) + '</p>';
    if (b.h) return '<h2>' + esc(b.h) + '</h2>';
    if ('img' in b) return '<figure>' + (b.img ? '<img src="' + esc(b.img) + '" alt="' + esc(b.cap || '') + '">' : '<div style="aspect-ratio:16/10;background:#E9EDF1;border-radius:12px"></div>') +
      (b.cap ? '<figcaption>' + esc(b.cap) + '</figcaption>' : '') + '</figure>';
    return '';
  }).join('');
  el.innerHTML = '<span class="a-cat">' + esc(p.cat) + '</span><h1>' + esc(p.title) + '</h1>' +
    '<div class="a-meta"><span class="av"' + (p.avatar ? ' style="background-image:url(' + esc(p.avatar) + ')"' : '') + '></span><b>' + esc(p.author) + '</b><span>' + esc(p.date.replace(/-/g, '.')) + '</span></div>' +
    (p.cover ? '<figure style="margin:28px 0 0"><img src="' + esc(p.cover) + '" alt="" style="width:100%;border-radius:12px"></figure>' : '') +
    '<div class="a-body">' + body + '</div>' + back;
})();
</script>
</body>
</html>
