<style>
  body{padding-bottom:0}
  footer{padding-bottom:2.75rem}   /* 이 페이지엔 하단 고정 바가 없다 */
  .todo b{font-size:1.1875rem}
  .done-hero{background:var(--dark);color:#fff;padding:2.5rem 0 3rem;position:relative;overflow:hidden;text-align:center}
  .done-hero .check{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 1.2rem;box-shadow:0 0 0 .8rem rgba(3,199,90,.15);animation:pop .5s ease both}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  .done-hero h1{font-family:var(--title);font-weight:400;font-size:2.6rem;line-height:1.2;letter-spacing:-.03em;margin-bottom:.8rem;word-break:keep-all}
  .done-hero h1 .g{color:var(--green)}
  .done-hero .when{display:inline-block;background:rgba(3,199,90,.16);color:var(--green);font-weight:900;font-size:1.0625rem;padding:.5rem 1rem;border-radius:999px;margin-bottom:1rem}
  .done-hero .sub{color:#B8B8B8;font-weight:700;font-size:1.0625rem;line-height:1.6;word-break:keep-all}
  .done-hero .count{max-width:20rem;margin:1.2rem auto 0}
  .todo{list-style:none;display:flex;flex-direction:column;gap:.7rem;margin:1.25rem 0 0}
  .todo li{display:flex;gap:.9rem;align-items:flex-start;background:#fff;border:1.5px solid var(--rule);border-radius:16px;padding:1.1rem 1.05rem}
  .todo .n{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--green);color:#04170D;font-weight:900;display:grid;place-items:center}
  .todo b{display:block;font-size:1.125rem;font-weight:900;line-height:1.4;margin-bottom:.2rem;word-break:keep-all}
  .todo p{font-size:1rem;color:var(--ink-2);line-height:1.55;font-weight:500;margin:0;word-break:keep-all}
  .todo .btn{margin-top:.7rem;padding:.8rem 1rem;font-size:1rem}
  .share{margin-top:1.25rem}
  .share .btn.ghost{color:var(--ink);border-color:var(--rule);background:#fff}
  .copied{display:none;text-align:center;color:var(--green-t);font-weight:900;margin-top:.6rem}
  .oc-hero{display:block;max-width:20rem;margin:1.3rem auto 0;background:#FEE500;color:#191919;box-shadow:0 5px 0 #C9B600}
  .oc-hero:hover,.oc-hero:active{box-shadow:0 3px 0 #C9B600}
  .done-hero{padding:3rem 0 3.5rem;min-height:calc(100vh - 2.5rem);min-height:calc(100svh - 2.5rem);display:flex;align-items:center}
  .done-hero .wrap{width:100%}
  .done-hero .step{display:inline-block;background:rgba(255,255,255,.1);color:#D6D6D6;font-weight:700;font-size:.9375rem;padding:.4rem .9rem;border-radius:999px;margin-bottom:1rem}
  .oc-hero{max-width:22rem;font-size:1.25rem;font-weight:900;padding:1.15rem 1rem;margin:.6rem auto 1.4rem}   /* 2026-10-11 JY: CTA를 제목 바로 아래로 */
</style>
</head>
<body>
<div class="topbar"><span class="dot"></span><span>쇼츠파이터 무료 라이브 | <span data-live-short>11월 4일 저녁 7시 30분</span></span></div>

<header class="done-hero" data-section="thanks_hero" data-order="1">
  <span class="glow"></span>
  <div class="wrap" style="position:relative;z-index:2">
    <span class="step">신청 접수 완료</span>
    <h1><span id="whoName"></span><span class="g" style="white-space:nowrap">한 단계</span> 남았습니다</h1>
    <a class="btn oc-hero" data-openchat href="#" target="_blank" rel="noopener">오픈채팅방 바로가기</a>
    <span class="when" data-live-long>11월 4일 수요일 저녁 7시 30분</span>
    <p class="sub">라이브 링크는 <b style="color:#fff">오픈채팅방에서만</b> 보내드립니다.</p>
  </div>
</header>

<footer>
  <div class="sec-inner">
    <span class="wm"><img loading="lazy" decoding="async" src="assets/flame.svg?v=1790520972" alt="">쇼츠파이터<small>by 그로우픽</small></span>

    <p data-biz></p>
  </div>
</footer>

<script>
(function(){
  var CFG=window.SF, GP=window.GP;
  /* 이름 */
  try{ var a=JSON.parse(sessionStorage.getItem('sf_applied')||'null'); if(a&&a.name){ document.getElementById('whoName').textContent=a.name+'님, '; } }catch(e){}
  /* 고객센터 */
  /* 고객센터 번호는 본문에 노출 안 함 (2026-10-09 JY: 문의는 오픈채팅으로). 법적 표기는 푸터에 작게 */
  document.querySelectorAll('[data-openchat]').forEach(function(a){ a.addEventListener('click',function(){ window.SF_track('join_openchat',{}); }); });
  window.SF_track('signup_complete_view',{});
})();
</script>

</html>
