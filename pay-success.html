<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 | 그로우픽</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo/favicon.svg?v=20260921c" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png?v=20260921c" sizes="32x32" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header id="gh"></header>

<!-- 확인 중 -->
<main class="order" id="wait">
  <h1>결제를 확인하고 있습니다</h1>
  <p style="font-size:17px;color:var(--ink-2);margin-top:10px">창을 닫지 말고 잠시만 기다려 주세요.</p>
</main>

<!-- 결제 완료 (서버가 토스 승인을 마친 뒤에만) -->
<main class="order" id="done" style="display:none">
  <div class="done-ico" style="margin-bottom:16px"><svg width="28" height="28" viewBox="0 0 22 22"><path d="M6 11.5l3.2 3.2L16 8" fill="none" stroke="#007A51" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>결제가 완료됐습니다</h1>
  <p style="font-size:17px;color:var(--ink-2);margin-top:10px">주문하신 번호의 카카오톡(문자)으로 수강 안내를 보내드립니다.</p>
  <section class="box">
    <h2>결제 내역</h2>
    <div class="row2"><span>과정</span><b id="d-course"></b></div>
    <div class="row2"><span>결제 금액</span><b id="d-amt"></b></div>
    <div class="row2"><span>결제 수단</span><b id="d-method"></b></div>
    <div class="row2"><span>주문 번호</span><b id="d-id"></b></div>
  </section>
  <p style="font-size:14px;color:var(--ink-3);margin-top:16px" id="d-help"></p>
  <a class="btn line block" id="d-receipt" target="_blank" rel="noopener" style="margin-top:20px;display:none">영수증 보기</a>
  <a class="btn line block" href="index.html" style="margin-top:10px">홈으로</a>
</main>

<!-- 확인 실패 -->
<main class="order" id="fail" style="display:none">
  <h1 id="f-title">결제 확인이 끝나지 않았습니다</h1>
  <p id="f-desc" style="font-size:17px;color:var(--ink-2);margin-top:10px"></p>
  <section class="box">
    <h2>문의하실 때 알려 주세요</h2>
    <div class="row2"><span>주문 번호</span><b id="f-id"></b></div>
    <div class="row2"><span>금액</span><b id="f-amt"></b></div>
  </section>
  <button class="btn block" id="f-retry" type="button" style="margin-top:20px">결제 확인 다시 하기</button>
  <a class="btn line block" id="f-call" style="margin-top:10px"></a>
</main>

<footer id="gf"></footer>
<script src="layout.js"></script>
<script>
/* 고객 제출 공용 부품 (customer-form-submit 스킬): 서버가 {ok:true} 로 답해야 성공 */
function confirmedSubmit(o){
  var finished = false, timer = null, ctrl = null;
  function end(ok, reason, j){
    if(finished) return; finished = true; clearTimeout(timer);
    try{ ok ? o.onOk(j) : o.onFail(reason, j); }catch(e){ if(window.console) console.error(e); }
  }
  if(!o.endpoint){ end(false, 'server:no_endpoint'); return; }
  try{ ctrl = new AbortController(); }catch(e){}
  timer = setTimeout(function(){ try{ if(ctrl) ctrl.abort(); }catch(e){} end(false, 'timeout'); }, o.timeout || 20000);
  try{
    fetch(o.endpoint, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(o.payload), signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(e){}
        if(j && j.ok === true) end(true, '', j);
        else end(false, 'server:' + ((j && j.error) || 'bad_response'), j);
      })
      .catch(function(){ end(false, 'network'); });
  }catch(e){ end(false, 'network'); }
}

(function () {
  var G = window.GP, F = window.GP_FMT, PAY = G.PAY;
  var q = new URLSearchParams(location.search);
  var data = { paymentKey: q.get('paymentKey'), orderId: q.get('orderId'), amount: Number(q.get('amount')) };
  var METHOD = { '카드': '신용 · 체크카드', '간편결제': '간편결제', '계좌이체': '계좌이체', '가상계좌': '가상계좌', '휴대폰': '휴대폰' };
  function show(id) { ['wait', 'done', 'fail'].forEach(function (x) { document.getElementById(x).style.display = x === id ? '' : 'none'; }); }

  function check() {
    show('wait');
    confirmedSubmit({
      endpoint: PAY.SERVER + '/confirm', payload: data, timeout: 30000,
      onOk: function (j) {
        var o = j.order || {};
        document.getElementById('d-course').textContent = o.orderName || '';
        document.getElementById('d-amt').textContent = F.won(o.amount || data.amount);
        document.getElementById('d-method').textContent = (METHOD[o.method] || o.method || '') + (o.installment ? ' (' + o.installment + '개월 할부)' : '');
        document.getElementById('d-id').textContent = o.orderId || data.orderId;
        document.getElementById('d-help').textContent = '수강 안내가 하루 안에 오지 않으면 ' + G.BIZ.PHONE + ' · ' + G.BIZ.EMAIL + ' 로 연락 주세요.';
        if (o.receiptUrl) { var r = document.getElementById('d-receipt'); r.href = o.receiptUrl; r.style.display = ''; }
        history.replaceState(null, '', location.pathname + '?orderId=' + encodeURIComponent(data.orderId) + '&ok=1');   // 주소의 결제키 지우기
        show('done');
      },
      onFail: function (reason, j) {
        var late = reason === 'timeout' || reason === 'network';
        document.getElementById('f-title').textContent = late ? '결제 확인이 늦어지고 있습니다' : '결제가 완료되지 않았습니다';
        document.getElementById('f-desc').textContent = late
          ? '결제는 됐는데 확인 응답만 늦는 것일 수 있습니다. 같은 결제가 두 번 되지 않으니 아래 버튼으로 다시 확인해 주세요. 계속 안 되면 연락 주세요.'
          : '카드 승인이 끝나지 않아 결제되지 않았습니다(' + ((j && j.message) || reason.replace('server:', '')) + '). 주문서로 돌아가 다시 시도해 주세요.';
        document.getElementById('f-id').textContent = data.orderId || '';
        document.getElementById('f-amt').textContent = data.amount ? F.won(data.amount) : '';
        var c = document.getElementById('f-call'); c.textContent = '전화 · 문자 ' + G.BIZ.PHONE; c.href = 'tel:' + G.BIZ.PHONE.replace(/\D/g, '');
        var rb = document.getElementById('f-retry');
        if (late) { rb.textContent = '결제 확인 다시 하기'; rb.onclick = check; }
        else { rb.textContent = '주문서로 돌아가기'; rb.onclick = function () { history.length > 2 ? history.go(-2) : (location.href = 'classes.html'); }; }
        try { navigator.sendBeacon(PAY.SERVER + '/log', /* submit-ok: 실패 기록용 부가 신호 */ new Blob([JSON.stringify({ stage: 'confirm', reason: reason, orderId: data.orderId })], { type: 'text/plain' })); } catch (e) {}
        show('fail');
      }
    });
  }
  if (q.get('ok') === '1') {   // 완료 화면에서 새로고침한 경우: 결제키가 없으니 다시 승인하지 않고 안내만
    document.getElementById('wait').innerHTML = '<h1>결제가 완료된 주문입니다</h1><p style="font-size:17px;color:var(--ink-2);margin-top:10px">주문 번호 ' + (q.get('orderId') || '') + '. 문의: ' + G.BIZ.PHONE + '</p><a class="btn line block" href="index.html" style="margin-top:20px">홈으로</a>';
    return;
  }
  if (!data.paymentKey || !data.orderId || !data.amount) {   // 주소에 결제 정보 없이 들어온 경우
    document.getElementById('f-title').textContent = '결제 정보가 없습니다';
    document.getElementById('f-desc').textContent = '결제가 진행되지 않았습니다. 클래스에서 다시 신청해 주세요.';
    document.getElementById('f-id').closest('section').style.display = 'none';
    var rb0 = document.getElementById('f-retry'); rb0.textContent = '클래스 보러 가기'; rb0.onclick = function () { location.href = 'classes.html'; };
    var c0 = document.getElementById('f-call'); c0.textContent = '전화 · 문자 ' + G.BIZ.PHONE; c0.href = 'tel:' + G.BIZ.PHONE.replace(/\D/g, '');
    show('fail'); return;
  }
  check();
})();
</script>
</body>
</html>
