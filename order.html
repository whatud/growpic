<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주문서 | 그로우픽</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo/favicon.svg?v=20260921c" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png?v=20260921c" sizes="32x32" type="image/png">
<link rel="icon" href="assets/logo/favicon.ico?v=20260921c" sizes="any">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png?v=20260921c">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header id="gh"></header>
<main class="order">
  <h1>주문서</h1>

  <section class="box">
    <h2>주문 상품</h2>
    <div class="row2"><span id="o-name"></span></div>
    <div class="fld"><label for="o-plan">반 선택</label><select id="o-plan"></select></div>
    <div class="row2" style="margin-top:12px"><span>정가</span><s id="o-list"></s></div>
    <div class="row2"><span>할인</span><span id="o-off" style="color:var(--sale);font-weight:700"></span></div>
    <div class="row2 total"><b>최종 결제 금액</b><b id="o-total"></b></div>
  </section>

  <section class="box">
    <h2>주문자 정보</h2>
    <p style="font-size:15px;color:var(--ink-3)">회원가입 없이 결제하실 수 있습니다.</p>
    <div class="fld"><label for="o-n">이름</label><input id="o-n" autocomplete="name"></div>
    <div class="fld"><label for="o-p">휴대폰 번호</label><input id="o-p" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel"></div>
    <div class="fld"><label for="o-e">이메일</label><input id="o-e" type="email" autocomplete="email"></div>
  </section>

  <section class="box">
    <h2>결제 수단</h2>
    <div class="paym">
      <label class="on"><input type="radio" name="pm" value="card" checked> 신용 · 체크카드</label>
      <label><input type="radio" name="pm" value="bank"> 계좌이체</label>
    </div>
  </section>

  <section class="box">
    <h2>약관 동의</h2>
    <label class="agree"><input type="checkbox" id="a-all"> <b style="color:var(--ink)">전체 동의</b></label>
    <label class="agree"><input type="checkbox" class="a"> <span>[필수] <a href="terms.html" target="_blank">이용약관</a> 동의</span></label>
    <label class="agree"><input type="checkbox" class="a"> <span>[필수] <a href="privacy.html" target="_blank">개인정보 수집·이용</a> 동의</span></label>
    <label class="agree"><input type="checkbox" class="a"> <span>[필수] <a href="refund.html" target="_blank">환불규정</a>을 확인했으며, 주문 내용에 동의합니다</span></label>
  </section>

  <button class="btn block" id="pay" type="button" style="margin-top:22px;height:60px;font-size:18px"></button>
  <p class="msg" id="msg"></p>
</main>
<footer id="gf"></footer>
<script src="layout.js"></script>
<script>
(function () {
  var G = window.GP, F = window.GP_FMT;
  var q = new URLSearchParams(location.search);
  var P = G.PRODUCTS.filter(function (x) { return x.ID === (q.get('product') || 'shortform-agency'); })[0] || G.PRODUCTS[0];
  var sel = document.getElementById('o-plan');
  sel.innerHTML = P.PLANS.map(function (pl) { return '<option value="' + pl.ID + '">' + pl.NAME + '</option>'; }).join('');
  if (q.get('plan')) sel.value = q.get('plan');
  document.getElementById('o-name').textContent = P.TITLE + ' ' + P.COHORT;
  function draw() {
    var pl = F && P.PLANS.filter(function (x) { return x.ID === sel.value; })[0];
    document.getElementById('o-list').textContent = F.won(pl.LIST);
    document.getElementById('o-off').textContent = '- ' + F.won(pl.LIST - pl.PRICE);
    document.getElementById('o-total').textContent = F.won(pl.PRICE);
    document.getElementById('pay').textContent = F.won(pl.PRICE) + ' 결제하기';
  }
  sel.addEventListener('change', draw); draw();

  document.querySelectorAll('.paym input').forEach(function (r) {
    r.addEventListener('change', function () { document.querySelectorAll('.paym label').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); }); });
  });
  var all = document.getElementById('a-all'), each = document.querySelectorAll('.a');
  all.addEventListener('change', function () { each.forEach(function (c) { c.checked = all.checked; }); });
  each.forEach(function (c) { c.addEventListener('change', function () { all.checked = Array.prototype.every.call(each, function (x) { return x.checked; }); }); });

  document.getElementById('pay').addEventListener('click', function () {
    var msg = document.getElementById('msg'); msg.style.display = 'block';
    if (!document.getElementById('o-n').value.trim() || document.getElementById('o-p').value.replace(/\D/g, '').length < 10) { msg.textContent = '이름과 휴대폰 번호를 입력해 주세요.'; return; }
    if (!Array.prototype.every.call(each, function (x) { return x.checked; })) { msg.textContent = '필수 약관에 모두 동의해 주세요.'; return; }
    /* PG 연동 자리: 승인 후 결제창 호출 코드를 여기에 넣는다 */
    msg.textContent = '결제 시스템 연결을 준비하고 있습니다. 수강 문의는 ' + G.BIZ.EMAIL + ' 로 보내주세요.';
  });
})();
</script>
</body>
</html>
