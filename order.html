<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주문서 | 그로우픽</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo/favicon.svg?v=20260921c" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png?v=20260921c" sizes="32x32" type="image/png">
<link rel="icon" href="assets/logo/favicon.ico?v=20260921c" sizes="any">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png?v=20260921c">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<!-- 토스페이먼츠 결제위젯 SDK (v2) -->
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<header id="gh"></header>
<main class="order" id="order">
  <h1>주문서</h1>

  <section class="box">
    <h2>주문 상품</h2>
    <div class="row2"><span id="o-name"></span></div>
    <div class="fld"><label for="o-plan">반 선택</label><select id="o-plan"></select></div>
    <div class="row2 total"><b>최종 결제 금액</b><b id="o-total"></b></div>
    <p id="o-mon" style="font-size:14px;color:var(--ink-3);text-align:right;margin-top:4px"></p>
    <p id="o-period" style="font-size:14px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"></p>
  </section>

  <section class="box">
    <h2>주문자 정보</h2>
    <p style="font-size:15px;color:var(--ink-3)">회원가입 없이 결제하실 수 있습니다. 수강 안내는 이 번호의 카카오톡(문자)으로 보내드립니다.</p>
    <div class="fld"><label for="o-n">이름</label><input id="o-n" autocomplete="name"></div>
    <div class="fld"><label for="o-p">휴대폰 번호</label><input id="o-p" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel"></div>
    <div class="fld"><label for="o-e">이메일 (선택)</label><input id="o-e" type="email" autocomplete="email"></div>
  </section>

  <section class="box toss-box">
    <h2>결제 수단</h2>
    <!-- 토스페이먼츠 결제위젯: 결제 수단 선택 + 결제 약관 -->
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <p class="msg" id="w-err" style="display:none"></p>
  </section>

  <section class="box">
    <h2>약관 동의</h2>
    <label class="agree"><input type="checkbox" id="a-all"> <b style="color:var(--ink)">전체 동의</b></label>
    <label class="agree"><input type="checkbox" class="a"> <span>[필수] <a href="terms.html" target="_blank">이용약관</a> 동의</span></label>
    <label class="agree"><input type="checkbox" class="a"> <span>[필수] <a href="privacy.html" target="_blank">개인정보 수집·이용</a> 동의</span></label>
    <label class="agree"><input type="checkbox" class="a"> <span>[필수] <a href="refund.html" target="_blank">환불규정</a>을 확인했으며, 주문 내용에 동의합니다</span></label>
  </section>

  <button class="btn block" id="pay" type="button" style="margin-top:22px;height:60px;font-size:18px" disabled>결제 준비 중</button>
  <p class="msg" id="msg"></p>
</main>
<footer id="gf"></footer>
<script src="layout.js"></script>
<script>
/* 고객 제출 공용 부품 (customer-form-submit 스킬, 2026-10-01): 서버가 {ok:true} 로 답해야 성공 */
function confirmedSubmit(o){
  var finished = false, timer = null, ctrl = null;
  function end(ok, reason, j){
    if(finished) return; finished = true; clearTimeout(timer);
    try{ ok ? o.onOk(j) : o.onFail(reason, j); }catch(e){ if(window.console) console.error(e); }
  }
  if(!o.endpoint){ end(false, 'server:no_endpoint'); return; }
  try{ ctrl = new AbortController(); }catch(e){}
  timer = setTimeout(function(){ try{ if(ctrl) ctrl.abort(); }catch(e){} end(false, 'timeout'); }, o.timeout || 20000);
  try{
    fetch(o.endpoint, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(o.payload), signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(e){}
        if(j && j.ok === true) end(true, '', j);
        else end(false, 'server:' + ((j && j.error) || 'bad_response'), j);
      })
      .catch(function(){ end(false, 'network'); });
  }catch(e){ end(false, 'network'); }
}

(function () {
  var G = window.GP, F = window.GP_FMT, PAY = G.PAY;
  var q = new URLSearchParams(location.search);
  var P = G.PRODUCTS.filter(function (x) { return x.ID === (q.get('product') || 'shortform-agency'); })[0] || G.PRODUCTS[0];
  var sel = document.getElementById('o-plan');
  sel.innerHTML = P.PLANS.map(function (pl) { return '<option value="' + pl.ID + '">' + pl.NAME + '</option>'; }).join('');
  if (q.get('plan')) sel.value = q.get('plan');
  document.getElementById('o-name').textContent = P.TITLE + ' ' + P.COHORT;
  document.getElementById('o-period').textContent = P.SERVICE_PERIOD ? '서비스 제공기간: ' + P.SERVICE_PERIOD : '';
  function plan() { return P.PLANS.filter(function (x) { return x.ID === sel.value; })[0]; }

  var btn = document.getElementById('pay'), msg = document.getElementById('msg');
  function say(t) { msg.style.display = t ? 'block' : 'none'; msg.textContent = t || ''; }
  function logFail(stage, reason) {   /* 실패 기록: 결제 서버 로그로 (submit-ok: 고객 접수와 무관한 분석용 신호) */
    try { navigator.sendBeacon(PAY.SERVER + '/log', /* submit-ok: 실패 기록용 부가 신호 */ new Blob([JSON.stringify({ stage: stage, reason: reason, product: P.ID, plan: sel.value, page: location.href })], { type: 'text/plain' })); } catch (e) {}
  }

  /* ---- 토스 결제위젯 ---- */
  var widgets = null, ready = false;
  function label() { btn.textContent = F.won(plan().PRICE) + ' 결제하기'; }
  function draw() {
    var pl = plan();
    document.getElementById('o-total').textContent = F.won(pl.PRICE);
    document.getElementById('o-mon').textContent = G.INSTALL_MONTHS + '개월 할부 시 월 ' + F.monthly(pl.PRICE) + ' (카드사 할부 수수료 별도)';
    if (ready) label();
    if (widgets) widgets.setAmount({ currency: 'KRW', value: pl.PRICE });
  }
  sel.addEventListener('change', draw); draw();

  (async function initWidget() {
    try {
      if (!window.TossPayments) throw new Error('sdk_blocked');
      var tp = TossPayments(PAY.TOSS_CLIENT_KEY);
      widgets = tp.widgets({ customerKey: TossPayments.ANONYMOUS });     // 비회원 결제
      await widgets.setAmount({ currency: 'KRW', value: plan().PRICE });
      await Promise.all([
        widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
        widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' })
      ]);
      ready = true; btn.disabled = false; label();
    } catch (e) {
      var w = document.getElementById('w-err'); w.style.display = 'block';
      w.textContent = '결제창을 불러오지 못했습니다. 새로고침해 주시고, 계속 안 되면 ' + G.BIZ.PHONE + ' 로 연락 주세요.';
      btn.textContent = '결제창을 불러오지 못했습니다';
      logFail('widget_init', String(e && e.message || e));
    }
  })();

  var all = document.getElementById('a-all'), each = document.querySelectorAll('.a');
  all.addEventListener('change', function () { each.forEach(function (c) { c.checked = all.checked; }); });
  each.forEach(function (c) { c.addEventListener('change', function () { all.checked = Array.prototype.every.call(each, function (x) { return x.checked; }); }); });

  /* ---- 결제하기: ① 서버에 주문번호·금액 먼저 기록(prepare, 확인 후) → ② 토스 결제창 ---- */
  btn.addEventListener('click', function () {
    if (!ready) return;
    var name = document.getElementById('o-n').value.trim();
    var phone = document.getElementById('o-p').value.replace(/\D/g, '');
    if (name.length < 2) { say('이름을 입력해 주세요.'); return; }
    if (!/^01[016789][0-9]{7,8}$/.test(phone)) { say('휴대폰 번호를 다시 확인해 주세요.'); return; }
    if (!Array.prototype.every.call(each, function (x) { return x.checked; })) { say('필수 약관에 모두 동의해 주세요.'); return; }
    say(''); btn.disabled = true; btn.textContent = '결제창 여는 중...';

    var d = new Date(), pad = function (n) { return String(n).padStart(2, '0'); };
    var orderId = 'GP' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    var email = document.getElementById('o-e').value.trim();
    var payload = {
      orderId: orderId, product: P.ID, plan: plan().ID, name: name, phone: phone, email: email,
      /* 유입 채널: 주소의 utm_* 가 우선, 없으면 랜딩이 실어 보낸 attr_* */
      utm_source: q.get('utm_source') || q.get('attr_source') || '', utm_medium: q.get('utm_medium') || q.get('attr_medium') || '',
      utm_campaign: q.get('utm_campaign') || q.get('attr_campaign') || '', referrer: document.referrer || ''
    };
    confirmedSubmit({
      endpoint: PAY.SERVER + '/prepare', payload: payload, timeout: 20000,
      onOk: function (j) {
        var req = {
          orderId: orderId, orderName: j.orderName,
          successUrl: location.origin + location.pathname.replace(/order\.html$/, 'pay-success.html'),
          failUrl: location.origin + location.pathname.replace(/order\.html$/, 'pay-fail.html'),
          customerName: name, customerMobilePhone: phone
        };
        if (email) req.customerEmail = email;
        widgets.requestPayment(req).catch(function (e) {    // 결제창을 닫거나 오류 (리다이렉트 전에 잡히는 경우)
          btn.disabled = false; label();
          say(e && e.code === 'USER_CANCEL' ? '결제를 취소하셨습니다. 다시 결제하시려면 버튼을 눌러 주세요.' : '결제창을 열지 못했습니다. 다시 시도하시거나 ' + G.BIZ.PHONE + ' 로 연락 주세요.');
          if (!(e && e.code === 'USER_CANCEL')) logFail('request_payment', e && (e.code || e.message));
        });
      },
      onFail: function (reason) {
        btn.disabled = false; label();
        say(reason === 'timeout'
          ? '주문 접수 확인이 늦어지고 있습니다. 잠시 후 다시 눌러 주시거나 ' + G.BIZ.PHONE + ' 로 연락 주세요.'
          : '주문을 접수하지 못했습니다. 다시 눌러 주시거나 ' + G.BIZ.PHONE + ' (카카오톡·문자 가능)로 연락 주세요. 입력하신 내용: ' + name + ' · ' + phone + ' · ' + plan().NAME);
        logFail('prepare', reason);
      }
    });
  });
})();
</script>
</body>
</html>
