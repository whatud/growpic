<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 실패 | 그로우픽</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo/favicon.svg?v=20260921c" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header id="gh"></header>
<main class="order">
  <h1 id="t">결제가 완료되지 않았습니다</h1>
  <p id="d" style="font-size:17px;color:var(--ink-2);margin-top:10px"></p>
  <button class="btn block" type="button" id="back" style="margin-top:24px">주문서로 돌아가기</button>
  <a class="btn line block" id="call" style="margin-top:10px"></a>
</main>
<footer id="gf"></footer>
<script src="layout.js"></script>
<script>
(function () {
  var G = window.GP, q = new URLSearchParams(location.search);
  var code = q.get('code') || '', message = q.get('message') || '';
  var cancel = code === 'PAY_PROCESS_CANCELED' || code === 'USER_CANCEL';
  document.getElementById('t').textContent = cancel ? '결제를 취소하셨습니다' : '결제가 완료되지 않았습니다';
  document.getElementById('d').textContent = cancel
    ? '결제되지 않았습니다. 다시 결제하시려면 주문서로 돌아가 주세요.'
    : '결제되지 않았습니다. ' + (message ? '사유: ' + message + '. ' : '') + '다른 카드나 결제 수단으로 다시 시도해 주세요.';
  document.getElementById('back').onclick = function () { history.length > 1 ? history.back() : (location.href = 'classes.html'); };
  var c = document.getElementById('call'); c.textContent = '전화 · 문자 문의 ' + G.BIZ.PHONE; c.href = 'tel:' + G.BIZ.PHONE.replace(/\D/g, '');
  if (!cancel) { try { navigator.sendBeacon(G.PAY.SERVER + '/log', /* submit-ok: 실패 기록용 부가 신호 */ new Blob([JSON.stringify({ stage: 'toss_fail', code: code, message: message, orderId: q.get('orderId') })], { type: 'text/plain' })); } catch (e) {} }
})();
</script>
</body>
</html>
